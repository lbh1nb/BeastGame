<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>analyze</title></head>
<body>
<div id="out">loading...</div>
<script>
async function analyze(name){
  const img = new Image();
  img.src = 'static/' + name + '.jpg';
  await img.decode();
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img,0,0);
  const d = ctx.getImageData(0,0,c.width,c.height).data;
  const corner = [d[0],d[1],d[2],d[3]];
  const counts = {};
  let step = 3;
  for (let i=0;i<d.length;i+=4*step*step){
    const key = (d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4);
    counts[key]=(counts[key]||0)+1;
  }
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  // find bounding box of non-background pixels using corner color
  const isBg = (i)=>{ const b=Math.abs(d[i]-d[0])+Math.abs(d[i+1]-d[1])+Math.abs(d[i+2]-d[2]); return b<40; };
  let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
  for(let y=0;y<c.height;y+=4)for(let x=0;x<c.width;x+=4){
    const i=(y*c.width+x)*4;
    if(!isBg(i)){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  document.getElementById('out').textContent = 'RESULT:' + JSON.stringify({name,w:img.width,h:img.height,corner,topColors:entries.slice(0,8),bbox:[minX,minY,maxX,maxY]});
}
analyze('sheep');
</script>
</body></html>
